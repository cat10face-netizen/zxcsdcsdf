
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VPN за 30 ₽ — Навсегда</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #020914;
    font-family: Arial, Helvetica, sans-serif;
}

.banner {
    position: relative;
    width: 100vw;
    height: 100vh;
    min-height: 500px;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    background:
        radial-gradient(ellipse at 50% 35%, #06254a 0%, transparent 48%),
        radial-gradient(ellipse at 15% 80%, #001c36 0%, transparent 50%),
        radial-gradient(ellipse at 85% 80%, #00351e 0%, transparent 45%),
        linear-gradient(135deg, #020711, #031322 50%, #010a12);
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Сетка на фоне */

.banner::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
        linear-gradient(rgba(0, 153, 255, 0.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 153, 255, 0.055) 1px, transparent 1px);
    background-size: 55px 55px;
    mask-image: linear-gradient(to bottom, transparent, black 30%, black 85%, transparent);
    animation: gridMove 20s linear infinite;
}

@keyframes gridMove {
    from { transform: translateY(0); }
    to { transform: translateY(55px); }
}

/* Световые пятна */

.glow {
    position: absolute;
    width: 700px;
    height: 700px;
    border-radius: 50%;
    filter: blur(130px);
    opacity: 0.18;
    pointer-events: none;
}

.glow-blue {
    background: #008cff;
    top: -250px;
    left: 15%;
    animation: glowBlue 8s ease-in-out infinite alternate;
}

.glow-green {
    background: #00ff77;
    bottom: -350px;
    right: 10%;
    animation: glowGreen 10s ease-in-out infinite alternate;
}

@keyframes glowBlue {
    from { transform: translate(0, 0); opacity: 0.12; }
    to { transform: translate(100px, 100px); opacity: 0.28; }
}

@keyframes glowGreen {
    from { transform: translate(0, 0); opacity: 0.12; }
    to { transform: translate(-100px, -80px); opacity: 0.25; }
}

/* Неоновые частицы */

.particles {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
}

.particle {
    position: absolute;
    width: var(--size, 5px);
    height: var(--size, 5px);
    left: var(--x);
    top: var(--y);
    border-radius: 50%;
    background: var(--color);
    box-shadow: 0 0 8px var(--color), 0 0 20px var(--color);
    opacity: 0;
    animation: particleFloat var(--duration, 12s) ease-in-out infinite;
    animation-delay: var(--delay, 0s);
}

@keyframes particleFloat {
    0% {
        transform: translate3d(0, 80px, 0) scale(0.5);
        opacity: 0;
    }
    20% { opacity: 0.9; }
    50% {
        transform: translate3d(40px, -100px, 0) scale(1.3);
        opacity: 0.8;
    }
    80% { opacity: 0.6; }
    100% {
        transform: translate3d(-30px, -220px, 0) scale(0.5);
        opacity: 0;
    }
}

/* Основной контент */

.content {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px;
}

/* Главный заголовок */

.title {
    font-size: clamp(42px, 6vw, 112px);
    font-weight: 900;
    color: #ffffff;
    letter-spacing: 3px;
    text-transform: uppercase;
    text-shadow:
        0 0 10px rgba(0, 145, 255, 0.9),
        0 0 30px rgba(0, 145, 255, 0.6),
        0 0 70px rgba(0, 145, 255, 0.4);
    opacity: 0;
    transform: translateY(-60px);
    animation: titleAppear 2s ease-in-out 0.5s infinite;
}

.title span {
    color: #42ed68;
    text-shadow:
        0 0 10px #00ff66,
        0 0 35px rgba(0, 255, 100, 0.7);
}

@keyframes titleAppear {
    0%, 10% {
        opacity: 0;
        transform: translateY(-60px);
    }
    25%, 75% {
        opacity: 1;
        transform: translateY(0);
    }
    90%, 100% {
        opacity: 0;
        transform: translateY(-20px);
    }
}

/* Щит */

.shield-container {
    position: relative;
    width: clamp(180px, 19vw, 350px);
    height: clamp(200px, 21vw, 390px);
    margin: 30px 0 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: shieldPulse 4s ease-in-out infinite;
}

.shield {
    width: 100%;
    height: 100%;
    overflow: visible;
    filter:
        drop-shadow(0 0 12px #00aaff)
        drop-shadow(0 0 28px rgba(0, 145, 255, 0.8))
        drop-shadow(0 0 45px rgba(0, 255, 110, 0.45));
}

.shield-path {
    fill: rgba(0, 70, 130, 0.2);
    stroke: url(#shieldGradient);
    stroke-width: 5;
    stroke-linejoin: round;
}

@keyframes shieldPulse {
    0%, 100% {
        transform: scale(0.95);
        filter: brightness(0.9);
    }
    50% {
        transform: scale(1.06);
        filter: brightness(1.35);
    }
}

/* Замок */

.lock {
    position: absolute;
    width: 75px;
    height: 85px;
    top: 43%;
    left: 50%;
    transform: translate(-50%, -50%);
    filter:
        drop-shadow(0 0 10px #00aaff)
        drop-shadow(0 0 20px #008cff);
}

.lock svg {
    width: 100%;
    height: 100%;
}

/* НАВСЕГДА */

.forever {
    font-size: clamp(48px, 7vw, 125px);
    font-weight: 900;
    color: #53ff5b;
    letter-spacing: 5px;
    text-transform: uppercase;
    text-shadow:
        0 0 10px #00ff66,
        0 0 30px rgba(0, 255, 80, 0.8),
        0 0 65px rgba(0, 255, 80, 0.45);
    opacity: 0;
    transform: scale(0.7);
    animation: foreverAppear 2s ease-in-out 1.5s infinite;
}

@keyframes foreverAppear {
    0%, 15% {
        opacity: 0;
        transform: scale(0.7);
    }
    35%, 75% {
        opacity: 1;
        transform: scale(1);
    }
    90%, 100% {
        opacity: 0;
        transform: scale(0.9);
    }
}

/* Подзаголовок */

.subtitle {
    margin-top: 15px;
    font-size: clamp(18px, 2.2vw, 38px);
    color: #e7f5ff;
    font-weight: 600;
    letter-spacing: 2px;
    text-shadow: 0 0 15px rgba(0, 145, 255, 0.6);
    opacity: 0;
    animation: subtitleAppear 2s ease-in-out 2s infinite;
}

@keyframes subtitleAppear {
    0%, 15% {
        opacity: 0;
        transform: translateY(20px);
    }
    35%, 75% {
        opacity: 1;
        transform: translateY(0);
    }
    90%, 100% {
        opacity: 0;
        transform: translateY(-10px);
    }
}

/* Telegram */

.telegram {
    margin-top: 35px;
    padding: 15px 45px;
    min-width: 350px;
    border: 3px solid #00e9a0;
    border-radius: 70px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    color: white;
    font-size: clamp(22px, 2.7vw, 48px);
    font-weight: 800;
    letter-spacing: 1px;
    background: rgba(0, 20, 30, 0.7);
    box-shadow:
        0 0 12px #00e9a0,
        0 0 30px rgba(0, 233, 160, 0.3),
        inset 0 0 15px rgba(0, 233, 160, 0.1);
    opacity: 0;
    animation:
        telegramAppear 2s ease-in-out 2.5s infinite,
        telegramGlow 3s ease-in-out infinite;
}

.telegram svg {
    width: 48px;
    height: 48px;
    fill: #25a9e9;
    filter: drop-shadow(0 0 10px #009dff);
}

@keyframes telegramAppear {
    0%, 15% {
        opacity: 0;
        transform: translateY(30px);
    }
    35%, 75% {
        opacity: 1;
        transform: translateY(0);
    }
    90%, 100% {
        opacity: 0;
        transform: translateY(-10px);
    }
}

@keyframes telegramGlow {
    0%, 100% {
        box-shadow:
            0 0 12px #00e9a0,
            0 0 25px rgba(0, 233, 160, 0.3);
    }
    50% {
        box-shadow:
            0 0 25px #00e9a0,
            0 0 55px rgba(0, 233, 160, 0.65);
    }
}

/* Медленное движение камеры */

.content {
    animation: cameraZoom 12s ease-in-out infinite alternate;
}

@keyframes cameraZoom {
    from { scale: 1; }
    to { scale: 1.025; }
}

/* Адаптация */

@media (max-width: 700px) {
    .content {
        padding: 15px;
    }

    .title {
        letter-spacing: 1px;
    }

    .shield-container {
        margin: 15px 0 5px;
    }

    .forever {
        letter-spacing: 2px;
    }

    .telegram {
        min-width: 250px;
        padding: 12px 25px;
        gap: 12px;
    }

    .telegram svg {
        width: 32px;
        height: 32px;
    }
}

@media (prefers-reduced-motion: reduce) {
    .banner *,
    .banner *::before,
    .banner *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
    }
}
</style>
</head>

<body>

<div class="banner">

    <div class="glow glow-blue"></div>
    <div class="glow glow-green"></div>

    <!-- Частицы -->
    <div class="particles" id="particles"></div>

    <div class="content">

        <!-- Заголовок -->
        <div class="title">
            VPN ЗА <span>30 ₽</span>
        </div>

        <!-- Светящийся щит -->
        <div class="shield-container">

            <svg class="shield" viewBox="0 0 300 340"
                 xmlns="http://www.w3.org/2000/svg">

                <defs>
                    <linearGradient id="shieldGradient"
                                    x1="0" y1="0"
                                    x2="1" y2="1">
                        <stop offset="0%" stop-color="#00c8ff"/>
                        <stop offset="50%" stop-color="#00aaff"/>
                        <stop offset="100%" stop-color="#00ff75"/>
                    </linearGradient>

                    <linearGradient id="shieldFill"
                                    x1="0" y1="0"
                                    x2="1" y2="1">
                        <stop offset="0%" stop-color="#008cff"
                                stop-opacity="0.35"/>
                        <stop offset="100%" stop-color="#00ff88"
                                stop-opacity="0.12"/>
                    </linearGradient>
                </defs>

                <path class="shield-path"
                      fill="url(#shieldFill)"
                      d="M150 12
                         L275 60
                         L260 190
                         Q245 280 150 325
                         Q55 280 40 190
                         L25 60 Z"/>

                <path d="M150 12
                         L275 60
                         L260 190
                         Q245 280 150 325
                         Q55 280 40 190
                         L25 60 Z"
                      fill="none"
                      stroke="url(#shieldGradient)"
                      stroke-width="3"
                      opacity="0.7"/>

            </svg>

            <!-- Замок внутри щита -->
            <div class="lock">
                <svg viewBox="0 0 100 110"
                     xmlns="http://www.w3.org/2000/svg">

                    <path d="M25 48 V32
                             A25 25 0 0 1 75 32
                             V48"
                          fill="none"
                          stroke="#dff8ff"
                          stroke-width="9"
                          stroke-linecap="round"/>

                    <rect x="12" y="45"
                          width="76" height="58"
                          rx="12"
                          fill="#dff8ff"
                          stroke="#00aaff"
                          stroke-width="3"/>

                    <circle cx="50" cy="69"
                            r="9"
                            fill="#006ebd"/>

                    <path d="M50 76 L45 90 H55 Z"
                          fill="#006ebd"/>

                </svg>
            </div>

        </div>

        <!-- Главный оффер -->
        <div class="forever">
            НАВСЕГДА
        </div>

        <!-- Подзаголовок -->
        <div class="subtitle">
            Безлимит. Без подписок.
        </div>

        <!-- Telegram -->
        <div class="telegram">

            <svg viewBox="0 0 24 24"
                 xmlns="http://www.w3.org/2000/svg">

                <path d="M21.8 4.2
                         L18.6 19.3
                         C18.35 20.35 17.75 20.6 16.9 20.1
                         L12.3 16.7
                         L10.1 18.8
                         C9.85 19.05 9.65 19.25 9.15 19.25
                         L9.5 14.55
                         L18.05 6.8
                         C18.4 6.5 17.95 6.35 17.5 6.65
                         L6.95 13.3
                         L2.4 11.9
                         C1.4 11.6 1.4 10.9 2.6 10.45
                         L20.35 3.6
                         C21.2 3.3 22.1 3.85 21.8 4.2Z"/>

            </svg>

            <span>@skipyyyvpn</span>

        </div>

    </div>
</div>

<script>
/* Генерация неоновых частиц */

const particles = document.getElementById("particles");

const colors = [
    "#00aaff",
    "#00eaff",
    "#00ff88",
    "#00ff55"
];

for (let i = 0; i < 65; i++) {

    const particle = document.createElement("div");

    particle.className = "particle";

    const size = Math.random() * 5 + 2;
    const x = Math.random() * 100;
    const y = Math.random() * 100;
    const duration = Math.random() * 10 + 8;
    const delay = Math.random() * -20;
    const color = colors[
        Math.floor(Math.random() * colors.length)
    ];

    particle.style.setProperty("--size", size + "px");
    particle.style.setProperty("--x", x + "%");
    particle.style.setProperty("--y", y + "%");
    particle.style.setProperty("--duration", duration + "s");
    particle.style.setProperty("--delay", delay + "s");
    particle.style.setProperty("--color", color);

    particles.appendChild(particle);
}
</script>

</body>
</html>
